
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent — Orb</title>
<style>
  :root{
    --bg:       #FED8E6;   /* matches the GIF's own background */
    --accent:   #f56a88;
    --ink:      #7c4a58;
    --ink-soft: #b07d8b;
    --orb: clamp(300px, 60vmin, 460px);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:var(--bg);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }
  .stage{
    height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(18px, 3.5vh, 40px);
  }

  .label{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  .label .name{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
  }
  .label .status{ font-size:20px; font-weight:600; color:var(--ink); }

  /* the orb is just the GIF; only its scale changes, smoothly, when speaking */
  .orb{
    width:var(--orb); height:var(--orb);
    display:block;
    transform-origin:center;
    transform:scale(1);
    transition:transform .55s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
    -webkit-user-drag:none; user-select:none;
  }
  .stage.speaking .orb{ transform:scale(1.16); }   /* smooth enlarge on speak */

  .controls{ display:flex; gap:10px; }
  .btn{
    border:none; padding:11px 26px; border-radius:999px;
    font-size:14px; font-weight:600; cursor:pointer;
    color:var(--ink); background:rgba(255,255,255,0.72);
    box-shadow:0 4px 14px rgba(180,90,110,0.18);
    backdrop-filter:blur(6px);
    transition:background .2s ease, transform .15s ease, color .2s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .btn.active{ background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(245,106,136,0.5); }

  @media (prefers-reduced-motion: reduce){
    .orb{ transition:none; }
  }
</style>
</head>
<body>
<div class="stage idle" id="stage">

  <div class="label">
    <div class="name">AI Agent</div>
    <div class="status" id="statusText">Listening</div>
  </div>

  <img class="orb" id="orb" alt="AI agent orb"
       src="orb.gif">

  <div class="controls">
    <button class="btn active" id="idleBtn">Idle</button>
    <button class="btn" id="talkBtn">Speaking</button>
  </div>

</div>
<script>
  const stage = document.getElementById('stage');
  const statusText = document.getElementById('statusText');
  const idleBtn = document.getElementById('idleBtn');
  const talkBtn = document.getElementById('talkBtn');

  function setState(isSpeaking){
    stage.classList.toggle('speaking', isSpeaking);
    stage.classList.toggle('idle', !isSpeaking);
    idleBtn.classList.toggle('active', !isSpeaking);
    talkBtn.classList.toggle('active', isSpeaking);
    statusText.textContent = isSpeaking ? 'Speaking' : 'Listening';
  }
  idleBtn.addEventListener('click', () => setState(false));
  talkBtn.addEventListener('click', () => setState(true));

  // Wire to your agent's TTS player:
  //   audio.onplay  = () => window.setAgentSpeaking(true);
  //   audio.onended = () => window.setAgentSpeaking(false);
  window.setAgentSpeaking = setState;
</script>
</body>
</html>
